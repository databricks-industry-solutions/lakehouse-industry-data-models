[project]
name = "vibe-modeling"
version = "0.9.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0", "sqlmodel>=0.0.27", "psycopg[binary,pool]>=3.2.11",
    "xlsxwriter>=3.2",
    "requests>=2.31",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    # Test-only: the assessment contract tests validate documents against vendored/assessment/assessment.schema.json.
    "jsonschema>=4.0",
]

[tool.apx.metadata]
app-name = "vibe-modeling"
app-slug = "vibe_modeling"
app-entrypoint = "vibe_modeling.backend.app:app"
api-prefix = "/api"
metadata-path = "src/vibe_modeling/_metadata.py"

[tool.apx.ui]
root = "src/vibe_modeling/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.version]
path = "src/vibe_modeling/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/vibe_modeling/__dist__", "src/vibe_modeling/_metadata.py"]
exclude = ["src/vibe_modeling/ui"]

[tool.hatch.build.targets.wheel.force-include]
"vendored/agent" = "vibe_modeling/vendored/agent"
"vendored/assessment" = "vibe_modeling/vendored/assessment"

[tool.hatch.build.targets.sdist.force-include]
"vendored/agent" = "vibe_modeling/vendored/agent"
"vendored/assessment" = "vibe_modeling/vendored/assessment"
