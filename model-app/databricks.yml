bundle:
  name: vibe-modeling

# Install-time choices (Lakebase project id, UC catalog name, SQL warehouse
# id, the optional Domain Taxonomy Builder flag and model service, the optional
# assessment flag and reader SP, the run-tags seed) are resolved by
# install/deploy_settings.py and rendered into src/app/.build/app.yml by the
# artifacts hook below. Deploy with install/install.sh: it resolves this run's
# flags over the settings it reads from the running app (the defaults for a new
# app), exports them as VIBE_MODELING_* (plus VIBE_MODELING_APP_NAME), then plans
# the deploy, refuses a plan that deletes or recreates the app, and applies
# exactly that plan (install/bundle_state.py). A deploy without it needs the app
# name (`--var app_name=<app>` or BUNDLE_VAR_app_name; the variable has no
# default) and every value exported; the hook refuses (exit 2) rather than
# render defaults (see INSTALL.md "Deploying without install.sh").
# The Databricks Apps `App` resource has no env field at the bundle level, so
# substitution happens at build time, not deploy time. install.sh and the hook
# never modify the source src/app/app.yml; only the build output is rewritten.

variables:
  app_name:
    description: "Databricks App resource name (the name shown in the workspace Apps UI). Required: `--var \"app_name=<name>\"`, BUNDLE_VAR_app_name, or install.sh's --app-name flag."

# One bundle root, and so one deployment state, per app name: two apps deploy
# side by side from one identity, and `dev` and `github-publish` (which differ
# only by a resource on the same app) are two ways to deploy the same app.
# install/bundle_state.py builds the same path (BUNDLE_ROOT) and moves the state
# of an install made before this layout (~/.bundle/vibe-modeling/<target>).
workspace:
  root_path: ~/.bundle/${bundle.name}/${var.app_name}

sync:
  include:
    - src/app/.build

# The install-time App overrides rendered by install/build_and_render.sh
# (today: the assessment's user_api_scopes). The CLI reads includes when it
# loads the bundle, before the artifacts build hook below runs, so every deploy
# path renders first (install/install.sh does); a deploy without it runs
# `bash install/build_and_render.sh` first, with the same app name and settings
# as the deploy, or re-runs the deploy when the hook says the scopes changed. A
# glob, so a fresh clone (nothing rendered, or the assessment off) still loads,
# with no user scopes.
include:
  - install/.generated/*.yml

# The hook gets the app name, target and CLI profile the CLI deploys with
# (${workspace.profile} is --profile, else DATABRICKS_CONFIG_PROFILE, else
# empty), so the rendered settings always belong to the app and workspace
# being deployed.
artifacts:
  default:
    build: install/build_and_render.sh --bundle-hook --app-name ${var.app_name} --target ${bundle.target} --profile "${workspace.profile}"

resources:
  apps:
    vibe-modeling-app:
      name: ${var.app_name}
      description: "Vibe Data Modeling control plane"
      source_code_path: ./src/app/.build
      # No `resources` field by default: a fresh install declares no app
      # resources, so it deploys cleanly on any workspace with no pre-existing
      # UC connection. (An empty `resources: []` is NOT equivalent — the
      # Databricks Terraform provider rejects it with an "inconsistent result"
      # error, since the API returns null for no resources.) The only resource
      # the app ever declares is the USE_CONNECTION grant on the `github_pr` UC
      # connection for the OPTIONAL publish-to-GitHub feature; it is injected by
      # the `github-publish` target below and re-applied on every deploy of that
      # target (the connection must pre-exist — see docs/github-integration-setup.md).
      # user_api_scopes: not declared here. With --enable-assessment the App
      # requests `workspace.workspace`, which lets the on-behalf-of user token
      # write into the signed-in user's own /Workspace/Users/<email>/ (the
      # assessment hand-off and its "Install skills" button); users consent
      # once. Without the flag the App declares no user_api_scopes. The scope
      # comes from install/.generated/app_scopes.yml (see `include` above),
      # which install/build_and_render.sh renders from the same
      # VIBE_MODELING_ASSESSMENT_ENABLED value it writes into app.yml: a
      # per-target override when the assessment is on, no file when it is off,
      # so an empty list is never sent. The iam.* defaults are
      # auto-granted and are NOT valid to declare (a deploy rejects them). A
      # workspace admin can restrict allowed app scopes (Settings > Development >
      # Apps); the install route reports that case. There is no documented
      # user_api_scope for Serving Endpoints. If the OBO publish turns out to
      # need an additional scope, it will be added here.

# No workspace.host hardcoded — the target workspace is driven by the CLI
# profile passed on the command line. This is what makes the bundle work
# across arbitrary Databricks accounts (AWS/Azure/any workspace) with no
# edits to this file.
#
# Usage: bash install/install.sh --profile <your-profile> --app-name <app>
# (INSTALL.md). Without it:
#   export VIBE_MODELING_APP_NAME=<app>
#   # plus every VIBE_MODELING_* setting (install/install.sh --dry-run prints them)
#   bash install/build_and_render.sh
#   databricks bundle plan --profile <your-profile> --var "app_name=<app>"
#   databricks bundle deploy --profile <your-profile> --var "app_name=<app>"
targets:
  # Default, portable target. App declares no resources, so a fresh install
  # deploys on any workspace with no pre-existing UC connection. install.sh
  # uses it unless the app declares the github_pr connection (github-publish).
  dev:
    mode: development
    default: true
  # Opt-in target for the publish-to-GitHub feature. Use only on a workspace
  # where you have already created the `github_pr` UC HTTP connection
  # (docs/github-integration-setup.md): `bash install/install.sh --profile <p>
  # --app-name <app> --enable-github-publish`; re-runs keep it, since the app
  # then declares the github_pr resource (--disable-github-publish switches back). It adds the
  # USE_CONNECTION grant to the app and re-applies it on every deploy of this
  # target. The default `dev` target declares no resources, so this opt-in is a
  # target rather than a CLI flag (an app `resources` list can't be set via
  # --var or env).
  github-publish:
    mode: development
    resources:
      apps:
        vibe-modeling-app:
          resources:
            - name: github_conn
              uc_securable:
                securable_full_name: github_pr
                securable_type: CONNECTION
                permission: USE_CONNECTION
