function Tour({onClose,getNodeRect}){
  const [index,setIndex]=useState(0);
  const [hole,setHole]=useState(null);
  const [pos,setPos]=useState(null);
  const [tick,setTick]=useState(0);
  const dirRef=useRef(1);
  const popRef=useRef(null);
  const PAD=6, GAP=14, PW=304;

  const rectFor=useCallback(step=>{
    if(step.target==='graph-node'){
      const r=getNodeRect&&getNodeRect();
      if(r&&r.width>0) return r;
      const el=document.querySelector('[data-tour="graph"]');
      if(el){
        const b=el.getBoundingClientRect();
        const w=Math.min(340,b.width*0.5),hh=Math.min(220,b.height*0.5);
        return {left:b.left+(b.width-w)/2,top:b.top+(b.height-hh)/2,width:w,height:hh};
      }
      return null;
    }
    const el=document.querySelector('[data-tour="'+step.target+'"]');
    if(!el) return null;
    const b=el.getBoundingClientRect();
    if(b.width===0&&b.height===0) return null;
    return {left:b.left,top:b.top,width:b.width,height:b.height};
  },[getNodeRect]);

  const go=useCallback(d=>{
    dirRef.current=d;
    setIndex(i=>{
      const ni=i+d;
      if(ni<0) return i;
      if(ni>=TOUR_STEPS.length){ onClose(true); return i; }
      return ni;
    });
  },[onClose]);

  useLayoutEffect(()=>{
    const step=TOUR_STEPS[index];
    if(!step) return;
    const r=rectFor(step);
    if(!r){
      const ni=index+dirRef.current;
      if(ni<0||ni>=TOUR_STEPS.length){ onClose(true); return; }
      setIndex(ni);
      return;
    }
    const h0={left:r.left-PAD,top:r.top-PAD,width:r.width+2*PAD,height:r.height+2*PAD};
    setHole(h0);
    const vw=window.innerWidth,vh=window.innerHeight;
    const ph=popRef.current?popRef.current.offsetHeight:160;
    let place=step.place||'bottom',left,top;
    if(place==='right'){
      left=h0.left+h0.width+GAP; top=h0.top;
      if(left+PW>vw-8){ place='bottom'; }
    }
    if(place==='bottom'||place==='top'){
      left=h0.left+h0.width/2-PW/2;
      if(place==='bottom'){
        top=h0.top+h0.height+GAP;
        if(top+ph>vh-8&&h0.top-GAP-ph>8){ place='top'; top=h0.top-GAP-ph; }
      }else{
        top=h0.top-GAP-ph;
        if(top<8){ place='bottom'; top=h0.top+h0.height+GAP; }
      }
    }
    left=Math.max(8,Math.min(left,vw-PW-8));
    top=Math.max(8,Math.min(top,vh-ph-8));
    setPos({left,top});
  },[index,tick,rectFor,onClose]);

  useEffect(()=>{
    const bump=()=>setTick(t=>t+1);
    window.addEventListener('resize',bump);
    window.addEventListener('scroll',bump,true);
    const key=e=>{
      if(e.key==='Escape'){ e.preventDefault(); onClose(false); }
      else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); go(1); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
    };
    window.addEventListener('keydown',key);
    return ()=>{
      window.removeEventListener('resize',bump);
      window.removeEventListener('scroll',bump,true);
      window.removeEventListener('keydown',key);
    };
  },[go,onClose]);

  const step=TOUR_STEPS[index];
  if(!step||!hole) return null;
  const last=index===TOUR_STEPS.length-1;
  return h(React.Fragment,null,
    h('div',{className:'tour-catch',style:{position:'fixed',inset:0,zIndex:5999},
      onClick:()=>onClose(false)}),
    h('div',{className:'tour-hole',style:{left:hole.left,top:hole.top,width:hole.width,height:hole.height}}),
    h('div',{className:'tour-pop',ref:popRef,
        style:pos?{left:pos.left,top:pos.top}:{left:-9999,top:-9999},
        onClick:e=>e.stopPropagation()},
      h('h4',null,step.title),
      h('p',null,step.body),
      h('div',{className:'tour-row'},
        h('span',{className:'tour-step'},(index+1)+' / '+TOUR_STEPS.length),
        h('button',{className:'tour-skip',onClick:()=>onClose(false)},'Skip'),
        index>0&&h('button',{className:'btn',onClick:()=>go(-1)},'Back'),
        h('button',{className:'btn btn-accent',onClick:()=>go(1)},last?'Done':'Next')
      )
    )
  );
}

function App(){
  // Graph state
  const [graphData,setGraphData]=useState(null);
  const [graphIndexes,setGraphIndexes]=useState(null);
  const cyRef=useRef(null);
  const containerRef=useRef(null);
  // Fingerprint of the last drawn view. A re-render that carries the same model
  // and the same filter is a box drag or resize, not a new view, so it gets the
  // plain fit and no camera move.
  const lastFitKeyRef=useRef({graph:null,key:''});
  const introRef=useRef(null);
  const introSeenRef=useRef(false);
  const viewerTookOverRef=useRef(false);

  // UI state
  const [showDomains,setShowDomains]=useState(true);
  const [animate,setAnimate]=useState(currentAnimate);
  const [sizeScale,setSizeScale]=useState(1.0);
  const [filterState,setFilterState]=useState({type:null,value:null});
  const [navHistory,setNavHistory]=useState([]);
  const [domainSizes,setDomainSizes]=useState({});
  const [selectedNode,setSelectedNode]=useState(null);
  const [selectedEdge,setSelectedEdge]=useState(null);
  const [treeClick,setTreeClick]=useState(null);
  const [expandedDomains,setExpandedDomains]=useState(new Set());
  const [expandedTables,setExpandedTables]=useState(new Set());
  const [searchTerm,setSearchTerm]=useState('');
  const [isLoading,setIsLoading]=useState(false);
  const [loadError,setLoadError]=useState(null);
  const [loadStatus,setLoadStatus]=useState('');
  const [theme,setTheme]=useState(currentTheme);
  const [palette,setPalette]=useState(currentPalette);
  // Gallery state. `manifest===null` means "not probed yet", `false` means
  // "absent", i.e. running as the Databricks App rather than the Pages gallery.
  const [manifest,setManifest]=useState(null);
  const [sel,setSel]=useState({industry:null,version:null,flavour:DEFAULT_SEL.flavour});
  const [progress,setProgress]=useState(null);
  const [cmdOpen,setCmdOpen]=useState(false);
  const [localModel,setLocalModel]=useState(false);
  const modelCache=useRef(new Map());
  const loadTokenRef=useRef(0);

  // Databricks browser state
  // Double-click detection
  const lastTapRef=useRef({});

  // Process model data
  const processModel=useCallback((rawModel,label)=>{
    if(!rawModel){setLoadError('No model data');return;}
    let model=rawModel;
    if(model.model&&model.model_requirements) model=model.model;
    if(!model.domains||!model.domains.length){
      if(model.data_domains&&model.data_domains.length) model.domains=model.data_domains;
    }
    if(!model.domains||!model.domains.length){
      setLoadError('No domains found in model JSON. Expected: { domains: [...] }');
      setIsLoading(false);
      return;
    }
    try{
      const gd=extractGraph(model);
      const idx=buildIndexes(gd);
      setGraphData({...gd,sourceLabel:label});
      setGraphIndexes(idx);
      setFilterState({type:null,value:null});
      setNavHistory([]);
      setLoadError(null);
      setSelectedNode(null);
      setSelectedEdge(null);
      setTreeClick(null);
    }catch(e){
      setLoadError('Error processing model: '+e.message);
    }
    setIsLoading(false);
  },[]);

  // Auto-load a server-bundled model on first mount (if the app ships one at
  // /model.json). Silently no-ops when absent or when the route returns HTML
  // (old servers with only a SPA catch-all), so the empty state still shows.
  /* Auto-load the App's bundled model. Runs only once the manifest probe has
     said "no manifest", because the gallery has no bundled model and the request
     would just be a 404 in every visitor's console. The server advertises what
     it has on /api/bundled-models, so that is asked first rather than probing
     /model.json and treating its 404 as the answer. */
  const [tourOpen,setTourOpen]=useState(false);
  const tourAutoRef=useRef(false);
  const getNodeRect=useCallback(()=>{
    const cy=cyRef.current; if(!cy||cy.destroyed()) return null;
    const nodes=cy.nodes().filter(n=>n.isChildless());
    const n=nodes.length?nodes[0]:null;
    if(!n) return null;
    const bb=n.renderedBoundingBox();
    const host=containerRef.current; if(!host) return null;
    const r=host.getBoundingClientRect();
    return {left:r.left+bb.x1,top:r.top+bb.y1,width:bb.x2-bb.x1,height:bb.y2-bb.y1};
  },[]);
  const closeTour=useCallback(()=>{ gcEvent('tour-close','Tour closed'); setTourOpen(false); store.set(TOUR_LS_KEY,'1'); },[]);
  useEffect(()=>{
    if(tourAutoRef.current) return;
    if(manifest&&graphData&&!store.get(TOUR_LS_KEY,'')){
      tourAutoRef.current=true;
      const t=setTimeout(()=>{gcEvent('tour-open-auto','Tour opened (first visit)');setTourOpen(true);},1000);
      return ()=>clearTimeout(t);
    }
  },[manifest,graphData]);

  const autoLoadedRef=useRef(false);
  useEffect(()=>{
    if(manifest!==false||autoLoadedRef.current)return;
    autoLoadedRef.current=true;
    (async()=>{
      try{
        // Ask the index first. A plain static host has no such endpoint, so fall
        // back to probing ./model.json, which is how that deployment works.
        let target={path:'/model.json',label:'bundled/model.json'};
        const listed=await fetch('./api/bundled-models',{headers:{'Accept':'application/json'}});
        if(listed.ok&&(listed.headers.get('content-type')||'').indexOf('json')>=0){
          const {models}=await listed.json();
          if(!Array.isArray(models)||!models.length)return;   // server says it has none
          target=models[0];
        }
        setIsLoading(true);setLoadError(null);
        setLoadStatus(`Loading ${target.label||'bundled model'}…`);
        const r=await fetch('.'+target.path,{headers:{'Accept':'application/json'}});
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        if((r.headers.get('content-type')||'').indexOf('json')<0)throw new Error('not json');
        const data=await r.json();
        setTimeout(()=>{
          try{processModel(data,target.label||'bundled/model.json');setLoadStatus('✓ '+(target.label||'bundled model'));}
          catch(err){setLoadError('Processing error: '+err.message);setIsLoading(false);setLoadStatus('✗ Error');}
        },50);
      }catch(err){
        setIsLoading(false);setLoadStatus('');
        /* No bundled model is a normal state: the empty state explains it. */
      }
    })();
  },[manifest,processModel]);

  /* ── Gallery: context detection ───────────────────────────
     manifest.json is emitted next to this page only by the Pages build, so its
     presence is what distinguishes the gallery from the Databricks App. The App
     serves its own bundled model.json and never sees the industry bar. */
  useEffect(()=>{
    let live=true;
    (async()=>{
      try{
        const r=await fetch('./manifest.json',{headers:{'Accept':'application/json'}});
        if(!r.ok) throw new Error('no manifest');
        const ct=r.headers.get('content-type')||'';
        if(ct.indexOf('json')<0) throw new Error('not json');
        const m=await r.json();
        if(!m||!Array.isArray(m.industries)||!m.industries.length) throw new Error('empty manifest');
        m.industries=sortIndustries(m.industries);
        if(live) setManifest(m);
      }catch(_){ if(live) setManifest(false); }
    })();
    return ()=>{live=false;};
  },[]);

  // ── Gallery: load one model ─────────────────────────────
  const loadEntry = useCallback(async (m,slug,version,flavour)=>{
    const industry=findIndustry(m,slug);
    const entry=findEntry(industry,version,flavour);
    if(!entry){ setLoadError(`No ${(flavour||'').toUpperCase()} model for ${slug} ${version||''}`); return; }
    const label=`${industry.display} ${entry.version.toUpperCase()} ${entry.flavour.toUpperCase()}`;
    const token=++loadTokenRef.current;

    const cached=modelCache.current.get(entry.path);
    if(cached){ setLoadError(null); setLoadStatus('✓ '+label); setLocalModel(false); processModel(cached,label); gcModelView(slug,entry.version,entry.flavour,industry&&industry.display); return; }

    setIsLoading(true); setLoadError(null);
    setProgress({received:0,total:entry.bytes,label});
    setLoadStatus(`Loading ${label} · ${fmtBytes(entry.bytes)}`);
    try{
      const data=await fetchModelJson(
        modelUrls(entry.path,entry.bytes),
        entry.bytes,
        (received,total)=>{ if(token===loadTokenRef.current) setProgress({received,total,label}); }
      );
      if(token!==loadTokenRef.current) return;   // a newer selection superseded this one
      modelCache.current.set(entry.path,data);
      setProgress(null);
      setLoadStatus('✓ '+label);
      setLocalModel(false);
      processModel(data,label);
      gcModelView(slug,entry.version,entry.flavour,industry&&industry.display);
    }catch(e){
      if(token!==loadTokenRef.current) return;
      setProgress(null); setIsLoading(false);
      setLoadStatus('');
      setLoadError(`Could not load ${label} (${fmtBytes(entry.bytes)}): ${e.message}`);
    }
  },[processModel]);

  const handleLoadJsonFile=useCallback((file)=>{
    if(!file) return;
    gcEvent('load-json','Load local model.json');
    loadTokenRef.current++;
    setLocalModel(true);
    setSel({industry:null,version:null,flavour:'ecm'});
    history.replaceState({},'',location.pathname);
    try{ localStorage.removeItem(SEL_LS_KEY); }catch(_){}
    setIsLoading(true); setLoadError(null); setProgress(null);
    setLoadStatus('Reading file…');
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(String(reader.result||''));
        setProgress(null);
        const label=file.name.replace(/\.json$/i,'')||file.name;
        processModel(data,label);
        setLoadStatus('');
      }catch(e){
        setIsLoading(false); setProgress(null); setLoadStatus('');
        setLoadError('Could not parse '+file.name+': '+e.message);
      }
    };
    reader.onerror=()=>{
      setIsLoading(false); setLoadStatus('');
      setLoadError('Could not read '+file.name);
    };
    reader.readAsText(file);
  },[processModel]);

  /* ── Gallery: URL is the source of truth ──────────────────
     Every selection is a history entry, so Back returns to the previous model
     and a copied link reopens exactly what the sender was looking at. */
  const readUrl=useCallback(()=>{
    const p=new URLSearchParams(location.search);
    return {industry:p.get('industry'),version:p.get('version'),
            flavour:p.get('flavour')==='mvm'?'mvm':(p.get('flavour')==='ecm'?'ecm':null)};
  },[]);

  const applySel=useCallback((next,push=true)=>{
    setSel(prev=>{
      const merged={...prev,...next};
      if(next.industry&&next.industry!==prev.industry&&!next.version) merged.version=null;
      if(push){
        const p=new URLSearchParams();
        if(merged.industry) p.set('industry',merged.industry);
        if(merged.version) p.set('version',merged.version);
        if(merged.flavour) p.set('flavour',merged.flavour);
        const q=p.toString();
        history.pushState({},'',q?('?'+q):location.pathname);
      }
      return merged;
    });
  },[]);

  useEffect(()=>{
    const onPop=()=>{
      const u=readUrl();
      setSel(prev=>({industry:u.industry,version:u.version,flavour:u.flavour||prev.flavour}));
    };
    window.addEventListener('popstate',onPop);
    return ()=>window.removeEventListener('popstate',onPop);
  },[readUrl]);

  /* Seed the selection once the manifest is known: an explicit link wins, then
     whatever this browser was last looking at, then the default. Written with
     replaceState rather than pushState so the first Back leaves the site
     instead of returning to a blank selection the visitor never chose. */
  const seededRef=useRef(false);
  useEffect(()=>{
    if(!manifest||seededRef.current) return;
    seededRef.current=true;
    const u=readUrl();
    const pick=(cand)=>cand&&findIndustry(manifest,cand.industry)?cand:null;
    const chosen=pick(u.industry?u:null)
      ||pick(readStoredSel())
      ||pick(DEFAULT_SEL)
      ||{industry:(manifest.industries[0]||{}).slug,version:null,flavour:'ecm'};
    const next={industry:chosen.industry,version:chosen.version||null,
                flavour:chosen.flavour||DEFAULT_SEL.flavour};
    setSel(next);
    const p=new URLSearchParams();
    p.set('industry',next.industry);
    if(next.version) p.set('version',next.version);
    if(next.flavour) p.set('flavour',next.flavour);
    history.replaceState({},'','?'+p.toString());
  },[manifest,readUrl]);

  // Selection changed -> fetch, and remember it for the next visit.
  useEffect(()=>{
    if(!manifest||!sel.industry) return;
    writeStoredSel({industry:sel.industry,version:sel.version,flavour:sel.flavour});
    loadEntry(manifest,sel.industry,sel.version,sel.flavour);
  },[manifest,sel.industry,sel.version,sel.flavour,loadEntry]);

  // Cmd/Ctrl-K opens the jump-to-industry palette.
  useEffect(()=>{
    if(!manifest) return;
    const onKey=e=>{
      if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); setCmdOpen(o=>!o); }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[manifest]);

  // ── Cytoscape mount/destroy ─────────────────────────────
  useEffect(()=>{
    if(!containerRef.current)return;
    const cy=cytoscape({
      container:containerRef.current,
      elements:[],
      style:getStylesheet(true),
      layout:{name:'circle'},
      minZoom:0.01,maxZoom:5,wheelSensitivity:0.3,
      userPanningEnabled:true,userZoomingEnabled:true,
      boxSelectionEnabled:false,
    });
    cyRef.current=cy;

    // Node click
    cy.on('tap','node',e=>{
      const data=e.target.data();
      const now=Date.now();
      const last=lastTapRef.current;
      const isDouble=last.id===data.id&&(now-last.time)<500;
      lastTapRef.current={id:data.id,time:now};
      if(isDouble){
        // Double-click → navigate into node
        if(data.type==='table'){
          navigate({type:'table',value:data.id});
        } else if(data.type==='domain'){
          navigate({type:'domain',value:data.id.replace('domain_','')});
        }
      } else {
        // Single-click → select, show details
        setSelectedNode(data);
        setSelectedEdge(null);
        setTreeClick(null);
        if(data.type==='domain'){
          navigate({type:'domain',value:data.id.replace('domain_','')});
        }
        if(data.type==='table'){
          navigate({type:'table',value:data.id});
        }
      }
    });

    // Edge click
    cy.on('tap','edge',e=>{
      const data=e.target.data();
      setSelectedEdge(data);
      setSelectedNode(null);
      setTreeClick(null);
    });

    // Background click - deselect
    cy.on('tap',e=>{
      if(e.target===cy){
        setSelectedEdge(null);
      }
    });

    // Touching the canvas hands the viewport to the viewer for as long as this view
    // is on screen: it lands any camera move in flight and stops the settling fits
    // from re-framing over the top of them.
    const host=containerRef.current;
    const takeOver=()=>{
      viewerTookOverRef.current=true;
      if(introRef.current) introRef.current.cancel(true);
    };
    const inputs=['wheel','mousedown','touchstart'];
    inputs.forEach(t=>host.addEventListener(t,takeOver,{passive:true}));

    return()=>{
      inputs.forEach(t=>host.removeEventListener(t,takeOver));
      cy.destroy();cyRef.current=null;
    };
  },[]);

  // ── Navigation ─────────────────────────────────────────
  const navigate=useCallback((newFilter)=>{
    gcEvent('drill-'+((newFilter&&newFilter.type)||'view'),'Drill into '+((newFilter&&newFilter.type)||'view'));
    setFilterState(prev=>{
      // Record every prior view — including the full model view (type:null) — so
      // Back walks the whole chain one level at a time up to the full model.
      setNavHistory(h=>[...h,prev]);
      return newFilter;
    });
  },[]);

  const goBack=useCallback(()=>{
    gcEvent('nav-back','Navigate back');
    setNavHistory(h=>{
      if(!h.length){setFilterState({type:null,value:null});return h;}
      const prev=h[h.length-1];
      setFilterState(prev);
      return h.slice(0,-1);
    });
  },[]);

  const openCmd=useCallback(()=>{ gcEvent('search-open','Open industry search'); setCmdOpen(true); },[]);

  // ── Graph elements computation ─────────────────────────
  const graphElements=useMemo(()=>{
    if(!graphData||!graphIndexes) return [];
    const {nodes,edges,domainColors,domainHierarchy}=graphData;
    const {tableById,domainByName,tablesByDomain,edgesBySource,edgesByTarget,edgesWithinDomain}=graphIndexes;
    const {type,value}=filterState;
    const viewKey=type?`${type}:${typeof value==='object'?JSON.stringify(value):value}`:'main';
    const curSizes=(domainSizes[viewKey]||{});

    // Apply domain sizes to domain nodes
    const applyDomainSizes=(els)=>els.map(el=>{
      if(el.data&&el.data.type==='domain'){
        const sz=curSizes[el.data.id]||{};
        return {...el,data:{...el.data,width:sz.width||DEFAULT_W,height:sz.height||DEFAULT_H}};
      }
      return el;
    });

    if(type==='table'&&value){
      const tid=value;
      const outEdges=edgesBySource[tid]||[];
      const inEdges=edgesByTarget[tid]||[];
      const outIds=new Set(outEdges.map(e=>e.data.target));
      const inIds=new Set(inEdges.map(e=>e.data.source));
      const relDomains=new Set();
      const result=[];
      const cn=tableById[tid];
      if(cn){relDomains.add(cn.data.domain);result.push({...cn,classes:'table-node domain-view-node center-node'});}
      [...outIds,...inIds].filter(id=>id!==tid).forEach(id=>{
        const n=tableById[id];if(!n)return;
        relDomains.add(n.data.domain);
        result.push({...n,classes:outIds.has(id)?'table-node domain-view-node fk-target':'table-node domain-view-node fk-source'});
      });
      // Add domain compound parents so every involved table sits inside its domain
      // box. STRIP the width/height from data so cytoscape auto-sizes the compound
      // parent to wrap its circular child cluster (like subdomain boxes do in
      // domain view). Otherwise the box defaults to 500x400 which looks tiny/huge
      // depending on how many children are inside.
      [...relDomains].filter(Boolean).forEach(d=>{
        const n=domainByName[d];
        if(n){
          const {width,height,...data}=n.data||{};
          result.push({...n,data,classes:'domain-node fk-domain'});
        }
      });
      outEdges.forEach(e=>result.push({...e,classes:'fk-edge outgoing-edge'}));
      inEdges.forEach(e=>result.push({...e,classes:'fk-edge incoming-edge'}));
      return result;
    }

    if(type==='edge'&&value){
      const ed=typeof value==='object'?value:{};
      const relDomains=new Set();
      const result=[];
      const sn=tableById[ed.source];
      const tn=tableById[ed.target];
      if(sn){relDomains.add(sn.data.domain);result.push({...sn,classes:'table-node fk-source'});}
      if(tn){relDomains.add(tn.data.domain);result.push({...tn,classes:'table-node fk-target'});}
      [...relDomains].filter(Boolean).sort().forEach(d=>{const n=domainByName[d];if(n)result.push(n);});
      (edgesBySource[ed.source]||[]).filter(e=>e.data.target===ed.target&&e.data.source_column===ed.source_column)
        .forEach(e=>result.push({...e,classes:'fk-edge outgoing-edge'}));
      return applyDomainSizes(result);
    }

    if(type==='domain'&&value){
      const dname=value;
      const dh=domainHierarchy[dname]||{};
      const subs=dh.subdomains||{};
      const hasSubs=Object.keys(subs).length>0;
      const domColor=(domainByName[dname]||{data:{}}).data.color||'var(--muted)';
      // Distinct colors for each subdomain within a domain view. Keeps the domain
      // color palette idea but rotates hues so each subdomain box is visually
      // differentiated. Industry-agnostic, deterministic per subdomain name.
      
      const result=[];
      const subNodeIds=new Set();
      if(hasSubs){
        Object.keys(subs).sort().forEach((sdname,sdi)=>{
          const sdId=`subdomain_${dname}_${sdname}`;
          subNodeIds.add(sdId);
          const sdSlot=SUBDOMAIN_SLOTS[sdi%SUBDOMAIN_SLOTS.length];
          const sdColor='var('+sdSlot+')';
          const semLbl=sdname.replace(/_/g,' ').replace(/-/g,' ');
          result.push({data:{id:sdId,label:semLbl,
            type:'subdomain',color:sdColor,slot:sdSlot,domain:dname,domain_color:domColor},classes:'subdomain-node'});
        });
      } else {
        const dn=domainByName[dname];
        if(dn)result.push(dn);
      }
      const domTables=tablesByDomain[dname]||[];
      const visibleIds=new Set();
      domTables.forEach(n=>{
        const sd=n.data.subdomain||'';
        const sdId=hasSubs&&sd?`subdomain_${dname}_${sd}`:'';
        const cloned={...n,classes:'table-node domain-view-node',data:{...n.data}};
        if(hasSubs&&sd&&subNodeIds.has(sdId)) cloned.data.parent=sdId;
        else if(hasSubs) delete cloned.data.parent;
        result.push(cloned);
        visibleIds.add(n.data.id);
      });
      // Render every edge whose BOTH endpoints are visible in this domain view
      // (co-visible), so two tables the user can see always show their link.
      // Robust vs. table names containing dots (unlike the prefix-split index).
      edges.forEach(e=>{
        if(visibleIds.has(e.data.source)&&visibleIds.has(e.data.target)) result.push(e);
      });
      const pos=calcDomainViewPositions(result);
      result.forEach(n=>{if(n.data&&pos[n.data.id])n.position=pos[n.data.id];});
      return applyDomainSizes(result);
    }

    if(type==='attribute'&&value){
      const parts=value.split('.');
      if(parts.length<3) return [];
      const [dname,tname,...rest]=parts;
      const aname=rest.join('.');
      const ddata=domainHierarchy[dname]||{};
      const tdata=(ddata.tables||{})[tname]||{};
      const attrs=tdata.attributes||[];
      const ainfo=attrs.find(a=>a.name===aname)||{};
      const aSlot=ainfo.pk?'--m-gold':ainfo.fk?'--danger':(ddata.slot||'--brand');
      const aColor='var('+aSlot+')';
      const tid=`${dname}.${tname}`;
      const attrNode={data:{id:`attr_${value}`,label:aname,type:'attribute',color:aColor,slot:aSlot,domain:dname,table:tname},
                      classes:'attribute-node',position:{x:0,y:0}};
      const result=[attrNode];
      const tn2=tableById[tid];
      if(tn2) result.push({...tn2,classes:'table-node center-node',position:{x:-150,y:0}});
      result.push({data:{id:`attr_edge_${value}`,source:tid,target:`attr_${value}`,label:'has attribute'},classes:'attr-edge'});
      if(ainfo.fk){
        const fkParts=ainfo.fk.split('.');
        if(fkParts.length>=2){
          const fkId=`${fkParts[0]}.${fkParts[1]}`;
          const fkN=tableById[fkId];
          if(fkN){
            result.push({...fkN,classes:'table-node fk-target',position:{x:150,y:0}});
            result.push({data:{id:`fk_edge_${value}`,source:`attr_${value}`,target:fkId,label:'references'},classes:'fk-edge outgoing-edge'});
          }
        }
      }
      return result;
    }

    // Main view — domain boxes auto-sized by table count, tables inside
    const allNodes=nodes.map(n=>{
      if(n.data.type==='domain'){
        const sz=curSizes[n.data.id]||{};
        const dname=n.data.id.replace('domain_','');
        const tblCount=(tablesByDomain[dname]||[]).length;
        const autoW=Math.max(DEFAULT_W, Math.ceil(Math.sqrt(tblCount))*140);
        const autoH=Math.max(DEFAULT_H, Math.ceil(Math.sqrt(tblCount))*120);
        return {...n,data:{...n.data,width:sz.width||autoW,height:sz.height||autoH}};
      }
      return n;
    });
    return [...allNodes,...edges];
  },[graphData,graphIndexes,filterState,domainSizes]);

  // ── Push elements to Cytoscape ─────────────────────────
  useEffect(()=>{
    const cy=cyRef.current;
    if(!cy)return;
    if(!graphData){cy.elements().remove();return;}
    const {type}=filterState;
    const fitTimers=[];
    try{
    // Filter out edges with missing source/target nodes
    const nodeIds=new Set(graphElements.filter(e=>!e.data.source).map(e=>e.data.id));
    const validElements=graphElements.filter(e=>{
      if(e.data.source&&!nodeIds.has(e.data.source)) return false;
      if(e.data.target&&!nodeIds.has(e.data.target)) return false;
      return true;
    });
    // Batch update
    cy.batch(()=>{
      cy.elements().remove();
      cy.add(paintElements(validElements,resolveTheme()));
    });
    // Choose layout strategy
    if(!type){
      // Circular grouped by domain — tables stay compound children so dragging a box moves them
      const tblNodes=cy.nodes('.table-node').sort((a,b)=>{
        const da=(a.data('domain')||''), db=(b.data('domain')||'');
        return da<db?-1:da>db?1:0;
      });
      const cnt=tblNodes.length;
      if(cnt>0){
        const r=Math.max(300, cnt*25);
        tblNodes.forEach((node,i)=>{
          const angle=(2*Math.PI*i/cnt)-(Math.PI/2);
          node.position({x:r*Math.cos(angle), y:r*Math.sin(angle)});
        });
      }
    } else if(type==='domain'){
      // Circular grouped by subdomain — compound parents auto-wrap; dragging box moves products
      const tblNodes=cy.nodes('.domain-view-node').sort((a,b)=>{
        const pa=(a.data('parent')||''), pb=(b.data('parent')||'');
        return pa<pb?-1:pa>pb?1:0;
      });
      const cnt=tblNodes.length;
      if(cnt>0){
        const r=Math.max(300, cnt*30);
        tblNodes.forEach((node,i)=>{
          const angle=(2*Math.PI*i/cnt)-(Math.PI/2);
          node.position({x:r*Math.cos(angle), y:r*Math.sin(angle)});
        });
      }
    } else if(type==='attribute'||type==='edge'){
      cy.layout({name:'preset',animate:false,fit:true,padding:60}).run();
    } else if(type==='table'){
      // Product focus view: SAME global-circle layout as main view. Related
      // tables sorted by domain on ONE big ring, center (focused) table at
      // origin. Compound domain boxes auto-wrap each domain's contiguous arc.
      // Large radius + domain sort minimises cross-domain box overlap.
      const centerNode=cy.nodes('.center-node');
      if(centerNode.length) centerNode.position({x:0,y:0});
      const ringNodes=cy.nodes('.domain-view-node').difference(centerNode).sort((a,b)=>{
        const da=(a.data('domain')||''), db=(b.data('domain')||'');
        if(da!==db) return da<db?-1:1;
        const la=(a.data('label')||''), lb=(b.data('label')||'');
        return la<lb?-1:la>lb?1:0;
      });
      const cnt=ringNodes.length;
      if(cnt>0){
        // Arc-length-based radius: keep ~75px arc between neighbours so nodes
        // never touch, but DO NOT inflate radius with count linearly (which
        // makes fit-to-viewport zoom out and shrink everything on screen).
        // r = arc_chord / (2*sin(pi/n)) guarantees non-overlapping nodes.
        const arc=75;
        const r=cnt<=1?200:Math.max(420, arc/(2*Math.sin(Math.PI/cnt)));
        ringNodes.forEach((node,i)=>{
          const angle=(2*Math.PI*i/cnt)-(Math.PI/2);
          node.position({x:r*Math.cos(angle), y:r*Math.sin(angle)});
        });
      }
    } else {
      // Any view type without a hand-placed arrangement above
      cy.layout({...CIRCLE_LAYOUT}).run();
    }
    // Frame the graph after every re-render (initial load, drag, resize, view
    // change). fit() only adjusts zoom + pan, so node positions the user dragged
    // into place survive it.
    // resize() first: the container is measured while it is still display:none, so
    // on a slow model nothing has refreshed that 0x0 reading by the time the first
    // fit runs, and the fit silently does nothing.
    const doFit=()=>{
      cy.resize();
      cy.fit(60);
      if(cy.zoom()>1.8) cy.zoom(1.8);
      cy.center();
    };
    // The later fits exist to catch labels and boxes that settle after the first
    // one, so they must not run while the camera is mid-flight towards the same
    // destination, nor once the viewer has taken the viewport. The view is only
    // marked as introduced once a move actually starts, so a fit that landed on a
    // not-yet-measured viewport leaves the next one free to try again.
    const viewKey=`${type||''}::${filterState.value||''}`;
    const introduced=()=>lastFitKeyRef.current.graph===graphData&&lastFitKeyRef.current.key===viewKey;
    const mark=()=>{lastFitKeyRef.current={graph:graphData,key:viewKey};};
    const camFree=()=>!viewerTookOverRef.current&&(!introRef.current||introRef.current.finished);
    viewerTookOverRef.current=false;
    const tryFly=()=>{
      if(introduced()) return;
      if(viewerTookOverRef.current||prefersReducedMotion()||!animate){mark();return;}
      const cam=playSpiralIntro(cy,containerRef.current,!introSeenRef.current);
      if(!cam) return;
      introRef.current=cam;
      introSeenRef.current=true;
      mark();
    };
    // The first framing is unconditional: until it runs the graph may be entirely
    // off screen, so there is no viewport worth preserving.
    fitTimers.push(setTimeout(()=>{doFit();tryFly();},200));
    fitTimers.push(setTimeout(()=>{if(camFree()){doFit();tryFly();}},1000));
    fitTimers.push(setTimeout(()=>{if(camFree())doFit();},3000));
    }catch(e){console.error('Cytoscape layout error:',e);}
    return()=>{
      fitTimers.forEach(clearTimeout);
      if(introRef.current){introRef.current.cancel(false);introRef.current=null;}
    };
  },[graphElements,filterState,graphData,domainSizes,animate]);

  // ── Update stylesheet when showDomains or sizeScale changes ─────
  useEffect(()=>{
    const cy=cyRef.current;
    if(!cy)return;
    cy.style(getStylesheet(showDomains,sizeScale));
    setTimeout(()=>cy.fit(50),50);
  },[showDomains,sizeScale]);

  // ── Theme or palette change ─────────────────────────────
  // The canvas holds resolved literals, so both the stylesheet and every node's
  // colour have to be re-read from the document. No re-layout and no re-fit:
  // the graph must not move underneath the user just because the hue changed.
  useEffect(()=>{
    applyTheme(theme);
    applyPalette(palette);
    const cy=cyRef.current;
    if(!cy)return;
    const t=resolveTheme();
    cy.style(getStylesheet(showDomains,sizeScale,t));
    repaintGraph(cy,t);
  },[theme,palette]);

  useEffect(()=>{store.set(ANIM_KEY,animate?'1':'0');},[animate]);

  const filterInfoText=useMemo(()=>{
    if(!graphData||!filterState.type) return '';
    const {type,value}=filterState;
    const {edgesBySource,edgesByTarget}=graphIndexes||{};
    if(type==='table'&&value){
      return `📊 ${value}`;
    }
    if(type==='domain'&&value) return `Domain: ${value}`;
    if(type==='edge'&&typeof value==='object') return `🔗 ${(value.source||'').split('.').pop()}.${value.source_column||''} → ${(value.target||'').split('.').pop()}.${value.target_column||''}`;
    if(type==='attribute'&&value) return `📊 ${(value||'').split('.').slice(1).join('.')}`;
    return '';
  },[graphData,graphIndexes,filterState]);

  // Tree interaction
  const handleToggleDomain=useCallback(dname=>{
    setExpandedDomains(s=>{const ns=new Set(s);ns.has(dname)?ns.delete(dname):ns.add(dname);return ns;});
  },[]);
  const handleToggleTable=useCallback(fid=>{
    setExpandedTables(s=>{const ns=new Set(s);ns.has(fid)?ns.delete(fid):ns.add(fid);return ns;});
  },[]);
  const handleClickDomain=useCallback(dname=>{
    setTreeClick({type:'domain',value:dname});
    setSelectedNode(null);setSelectedEdge(null);
    navigate({type:'domain',value:dname});
  },[navigate]);
  const handleClickTable=useCallback(fid=>{
    setTreeClick({type:'table',value:fid});
    setSelectedNode(null);setSelectedEdge(null);
    navigate({type:'table',value:fid});
  },[navigate]);
  const handleClickAttr=useCallback(aid=>{
    setTreeClick({type:'attribute',value:aid});
    setSelectedNode(null);setSelectedEdge(null);
    navigate({type:'attribute',value:aid});
  },[navigate]);

  const sortedDomains=useMemo(()=>{
    if(!graphData) return [];
    return Object.entries(graphData.domainHierarchy||{}).sort((a,b)=>a[0].localeCompare(b[0]));
  },[graphData]);

  const btnStyle={padding:'8px 12px',background:'var(--line)',color:'var(--ink)',border:'none',borderRadius:4,cursor:'pointer',fontSize:12,marginRight:6};

  const gallery=!!manifest;

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100vh',background:'var(--bg)',color:'var(--ink)',overflow:'hidden'}},

    // ── The single top line ──────────────────────────────
    // The "✓ loaded" form would just repeat the model name beside it, so the
    // status only shows while a fetch is actually in flight.
    h(TopBar,{manifest,sel,graphData,loadStatus:isLoading?loadStatus:'',localModel,
      onSelect:next=>{
        if(next.industry) setLocalModel(false);
        applySel(next);
      },
      onJump:openCmd,
      onLoadJson:handleLoadJsonFile,
      showDomains,onShowDomains:setShowDomains,animate,onAnimate:setAnimate,
      actions:h(React.Fragment,null,
        // Graph controls do nothing without a graph, so they stay hidden until
        // one is loaded rather than sitting there inert.
        graphData&&h(React.Fragment,null,
          h('button',{className:'tbtn icononly',title:'Zoom out','aria-label':'Zoom out',
            onClick:()=>cyRef.current&&cyRef.current.zoom(cyRef.current.zoom()*0.8)},
            h(ToolbarIcon,{name:'zoomOut'})),
          h('button',{className:'tbtn icononly',title:'Zoom in','aria-label':'Zoom in',
            onClick:()=>cyRef.current&&cyRef.current.zoom(cyRef.current.zoom()*1.25)},
            h(ToolbarIcon,{name:'zoomIn'})),
          h('button',{className:'tbtn icononly',title:'Decrease node and label size','aria-label':'Decrease font size',
            onClick:()=>setSizeScale(s=>Math.max(0.5,s-0.2))},
            h(ToolbarIcon,{name:'fontDown'})),
          h('button',{className:'tbtn icononly',title:'Increase node and label size','aria-label':'Increase font size',
            onClick:()=>setSizeScale(s=>Math.min(3,s+0.2))},
            h(ToolbarIcon,{name:'fontUp'})),
          h('button',{className:'tbtn icononly',title:'Fit graph to view','aria-label':'Fit to view',
            onClick:()=>cyRef.current&&cyRef.current.fit(50)},
            h(ToolbarIcon,{name:'fit'}))
        ),
        gallery&&graphData&&h('button',{className:'iconbtn',title:'Take a guided tour','aria-label':'Take a guided tour',
          onClick:()=>{gcEvent('tour-open-manual','Tour opened (button)');setTourOpen(true);}},'?'),
        h(ThemeControls,{theme,onTheme:setTheme,palette,onPalette:setPalette})
      )}),

    // Determinate transfer progress: the manifest gives us the true blob size,
    // so this is a real percentage rather than a spinner pretending to be one.
    progress&&h('div',{className:'bar',role:'progressbar',
        'aria-valuemin':0,'aria-valuemax':100,
        'aria-valuenow':progress.total?Math.round(100*Math.min(1,progress.received/progress.total)):0},
      h('i',{style:{width:(progress.total?Math.min(100,100*progress.received/progress.total):8)+'%'}})
    ),

    // ── Main body ────────────────────────────────────────
    h('div',{style:{display:'flex',flex:1,overflow:'hidden'}},

      // Left sidebar: the model outline.
      h('div',{'data-tour':'domains',style:{width:250,background:'var(--card)',borderRight:'1px solid var(--line)',
                      display:'flex',flexDirection:'column',flexShrink:0}},
        h('div',{style:{padding:'12px 15px 0',flexShrink:0}},
          graphData&&h('button',{className:'btn',
              title:'Reset to the full model view',
              disabled:!filterState.type,
              style:{width:'100%',justifyContent:'center',marginBottom:8},
              onClick:()=>{
                gcEvent('full-model-view','Full model view');
                setFilterState({type:null,value:null});setNavHistory([]);
                setTimeout(()=>cyRef.current&&cyRef.current.fit(50),100);
              }},
            '⌂ Full Model View'),
          h('input',{type:'text',placeholder:'Search domains, tables...',
                     value:searchTerm,onChange:e=>setSearchTerm(e.target.value),
                     style:{marginBottom:6}})
        ),
        h('p',{style:{color:'var(--faint)',fontSize:10,margin:'0 15px 6px',padding:0}},'Click + to expand, click name to view'),
        h('div',{style:{flex:1,overflowY:'auto',padding:'0 15px 15px'}},
          !graphData&&h('div',{style:{textAlign:'center',paddingTop:30}},
            h('div',{style:{fontSize:32,marginBottom:10}},'📊'),
            h('p',{style:{color:'var(--faint)',fontSize:12}},'No model loaded')
          ),
          graphData&&sortedDomains.map(([dname,ddata])=>
            h(TreeNode,{key:dname,domainName:dname,domainData:ddata,
                        expandedDomains,expandedTables,searchTerm,
                        onToggleDomain:handleToggleDomain,onToggleTable:handleToggleTable,
                        onClickDomain:handleClickDomain,onClickTable:handleClickTable,
                        onClickAttr:handleClickAttr})
          )
        )
      ),

      // Graph area
      h('div',{'data-tour':'graph',style:{flex:1,position:'relative',background:'var(--bg)',
                      backgroundImage:'radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0)',
                      backgroundSize:'40px 40px'}},

        // Back button — present in any view other than the full model view; each
        // press walks back one level until the full model is reached.
        filterState.type&&h('button',{
          onClick:goBack,
          style:{position:'absolute',top:15,left:15,zIndex:1000,padding:'9px 16px',
                 background:'var(--card)',color:'var(--ink)',border:'1px solid var(--line-strong)',borderRadius:9,
                 cursor:'pointer',fontSize:13,fontWeight:650,boxShadow:'var(--shadow-lg)'}
        },'← Back'),

        // Filter info badge
        filterInfoText&&h('div',{style:{position:'absolute',top:15,right:15,zIndex:1000,
                                        padding:'7px 13px',background:'var(--g-amber-tile)',
                                        border:'1px solid var(--g-amber-bd)',
                                        color:'var(--g-amber-ink)',borderRadius:9,fontSize:12,fontWeight:650}},
          filterInfoText),

        // No landing page: the gallery opens straight into a model, so this only
        // shows if that model could not be resolved at all.
        !graphData&&!isLoading&&!loadError&&h('div',
          {style:{position:'absolute',top:0,left:0,right:0,bottom:0,
                                                             display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}},
          h('div',{style:{textAlign:'center'}},
            h('div',{style:{fontSize:48,marginBottom:15}},'📊'),
            h('p',{style:{color:'var(--muted)',fontSize:14}},
              gallery?'Pick an industry to open its model':'No model.json is bundled with this app'),
            gallery&&h('button',{className:'btn',style:{marginTop:12},
              onClick:openCmd},'Choose industry')
          )
        ),

        // Loading overlay
        isLoading&&h('div',{style:{position:'absolute',top:0,left:0,right:0,bottom:0,
                                    background:'var(--scrim)',zIndex:998,
                                    display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}},
          h('div',{style:{color:'var(--g-violet-line)',fontSize:13,marginBottom:16}},'Loading model...'),
          h('div',{className:'spinner'})
        ),

        // Error display
        loadError&&h('div',{style:{position:'absolute',top:'50%',left:'50%',
                                    transform:'translate(-50%,-50%)',maxWidth:600,width:'90%',zIndex:1001}},
          h('div',{style:{background:'var(--card)',padding:30,borderRadius:12,border:'1px solid var(--line)',textAlign:'center',boxShadow:'var(--shadow-lg)'}},
            h('div',{style:{fontSize:48,marginBottom:15}},'⚠️'),
            h('h2',{style:{color:'var(--danger)',fontSize:20,marginBottom:15}},'Failed to Load Data Model'),
            h('div',{style:{fontSize:13,background:'var(--danger-bg)',padding:15,borderRadius:8,
                             border:'2px solid var(--danger)',textAlign:'left',wordBreak:'break-word',marginBottom:20}},
              h('strong',{style:{color:'var(--danger)'}},'Error: '),h('span',{style:{color:'var(--g-amber-line)'}},loadError)
            ),
            gallery&&sel.industry&&h('button',{style:{...btnStyle,background:'var(--brand)',color:'var(--on-accent)',border:'none'},
              onClick:()=>{setLoadError(null);loadEntry(manifest,sel.industry,sel.version,sel.flavour);}},'Retry'),
            gallery&&h('button',{style:{...btnStyle},
              onClick:()=>{setLoadError(null);openCmd();}},'Choose another industry'),
            h('button',{style:{...btnStyle,background:'var(--danger)',color:'var(--on-accent)',border:'none',marginRight:0},
              onClick:()=>setLoadError(null)},'Dismiss')
          )
        ),

        // Cytoscape container
        h('div',{ref:containerRef,style:{width:'100%',height:'100%',display:graphData?'block':'none'}})
      ),

      // Right panel
      h('div',{style:{width:280,background:'var(--card)',borderLeft:'1px solid var(--line)',
                      display:'flex',flexDirection:'column',flexShrink:0,overflowY:'auto'}},
        h(NodeInfoPanel,{
          selectedNode:treeClick?null:selectedNode,
          selectedEdge:treeClick?null:selectedEdge,
          treeClick,graphData,
          domainSizes,setDomainSizes,filterState
        })
      )
    ),

    // Version badge
    h('div',{style:{position:'fixed',bottom:10,right:14,zIndex:3000,
                    padding:'4px 10px',background:'var(--well)',border:'1px solid var(--line)',
                    borderRadius:12,fontSize:11,color:'var(--muted)'}},
      gallery
        ? (UPSTREAM_REPO.owner+'/'+UPSTREAM_REPO.repo+' @ main')
        : 'v1.1'),

    // Cmd-K jump palette — 40 industries do not browse well by clicking alone.
    gallery&&cmdOpen&&h(CommandPalette,{manifest,
      onPick:slug=>{setCmdOpen(false);setLocalModel(false);applySel({industry:slug});},
      onClose:()=>setCmdOpen(false)}),

    // First-visit guided tour of the viewer's features (replayable via the ? button).
    tourOpen&&h(Tour,{onClose:closeTour,getNodeRect})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
